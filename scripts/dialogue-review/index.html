<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微信台词审阅 · 本地作者工具</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f4;color:#24352e;font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #ccd6d0;border-radius:9px;padding:8px 14px;background:white;color:#24352e}button:hover{background:#edf4ef}button:disabled{opacity:.45;cursor:default}.primary{background:#285d48;color:white;border-color:#285d48}.primary:hover{background:#1c4c38}header{background:#fff;border-bottom:1px solid #dce3de;padding:20px 30px}h1{font-size:24px;margin:0 0 3px}p{margin:4px 0;color:#607268}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.layout{max-width:1380px;margin:auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:25px;padding:24px}aside{align-self:start;position:sticky;top:16px;background:white;border:1px solid #dce3de;padding:18px;border-radius:14px}aside label{display:block;margin-bottom:16px;font-weight:600}aside select,aside input[type=search]{display:block;width:100%;margin-top:6px;padding:9px;border:1px solid #ced8d2;border-radius:8px;background:white}aside label.check{font-weight:400;display:flex;gap:8px}.hint{font-size:13px;color:#6e7c74}.status{padding:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#a43832}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}article{background:white;padding:20px;border:1px solid #dce3de;border-radius:14px;margin-bottom:16px}article.dirty{border-color:#8caa6b}article.flag{border-left:4px solid #c89a42}.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#6e7c74}.meta strong{color:#24352e;font-size:16px}.branch{margin:10px 0;font-size:13px;background:#f2f5ef;border-radius:6px;padding:7px 10px;overflow-wrap:anywhere}textarea{display:block;width:100%;resize:vertical;min-height:78px;padding:13px;margin:12px 0;border:1px solid #cdd8d0;border-radius:9px;background:#fcfdfb;color:#26362e;line-height:1.65}textarea:focus{outline:2px solid #9ac8ad;border-color:transparent}.old{white-space:pre-wrap;background:#fff7eb;padding:12px;border-radius:7px;font-size:14px;margin:10px 0}.tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px}.source{margin-top:10px;color:#89958d;font-size:11px;overflow-wrap:anywhere}.context{background:#f2f4f3;border-radius:9px;padding:12px;margin-top:12px}.bubble{margin:5px 0;padding:8px 11px;background:white;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.bubble small{display:block;color:#76867c}.bubble.me{background:#e1f1df}.empty{padding:70px 20px;text-align:center;color:#6c7c71}.footer{display:flex;gap:15px;justify-content:center;margin:25px}.notice{font-size:13px;max-width:750px}#draftFile{display:none}@media(max-width:800px){.top{display:block}.actions{margin-top:15px}.layout{display:block;padding:12px}aside{position:static;margin-bottom:15px}.toolbar{flex-wrap:wrap}header{padding:18px}article{padding:15px}}
</style>
<header><div class="top"><div><h1>微信台词审阅</h1><p>先听清每个人的语气，再把修改放回对话里。</p></div><div class="actions"><button id="reload">重新读取</button><button id="export">导出草稿</button><button id="import">导入草稿</button><button class="primary" id="save" disabled>保存到剧情文件</button></div></div><p class="notice">仅本地作者使用 · 只改现有文字，不改剧情条件或存档。保存会备份原文件；不会自动构建或发布。</p><div id="status" class="status" role="status">正在读取…</div></header>
<div class="layout"><aside><label>章节<select id="chapter" aria-label="章节"><option value="">全部章节</option></select></label><label>人物<select id="person" aria-label="人物"><option value="">所有人物</option></select></label><label>搜索原文或修改稿<input id="search" type="search" placeholder="一句话、关键词、消息 ID"></label><label>内容<select id="scope" aria-label="内容"><option value="chat">微信消息和玩家选项</option><option value="memo">备忘录</option><option value="social">朋友圈</option><option value="scene">现场台词</option><option value="all">全部文字</option></select></label><label>审阅状态<select id="state" aria-label="审阅状态"><option value="">全部</option><option value="flag">待润色</option><option value="unread">尚未审阅</option><option value="reviewed">已审阅</option><option value="changed">已修改</option></select></label><label class="check"><input id="context" type="checkbox" checked>显示相邻对话</label><p class="hint">人物筛选保留上下文，方便发现接话不自然。分支均可审阅，但分支之间不代表连续发生。</p><p class="hint">“已审阅 / 待润色”和未保存草稿记在此浏览器。保存后重新构建，再试玩确认节奏。</p></aside><main><div class="toolbar"><strong id="count"></strong><span class="hint">每页 40 条 · 选项旁显示分支信息</span></div><div id="list"></div><div class="footer"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></main></div><input id="draftFile" type="file" accept="application/json,.json">
<script>
const token='__REVIEW_TOKEN__', $=id=>document.getElementById(id), storage='shoukun-dialogue-review-v1';
let data, page=0, busy=false, saveArmed=false, edits={}, marks={};
try{({edits={},marks={}}=JSON.parse(localStorage.getItem(storage)||'{}'));}catch{}
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
function status(text,error=false){$('status').textContent=text;$('status').className='status'+(error?' error':'');}
function persist(){try{localStorage.setItem(storage,JSON.stringify({edits,marks}));}catch{status('浏览器未能保存草稿，请导出草稿以免丢失。',true);}}
function value(row){return edits[row.key]?.text??row.text;}
function pending(){return Object.entries(edits).filter(([,v])=>v.text!==v.original);}
function updateSave(){ $('save').disabled=busy||!pending().length;$('save').textContent=busy?'正在保存…':`${saveArmed?'确认保存':'保存到剧情文件'}${pending().length?'（'+pending().length+'）':''}`; }
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Review-Token':token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const result=await r.json();if(!r.ok)throw Error(result.error||'请求失败');return result;}
async function load(){data=await api('/data');const chapter=$('chapter').value,person=$('person').value;$('chapter').replaceChildren(new Option('全部章节',''));data.chapters.forEach(c=>$('chapter').add(new Option(c.title,c.id)));$('chapter').add(new Option('其他互动','other'));$('chapter').value=chapter;
$('person').replaceChildren(new Option('所有人物',''));Object.entries(data.names).forEach(([id,name])=>$('person').add(new Option(name,id)));$('person').value=person;
let conflicts=0;const rows=new Map(data.rows.map(r=>[r.key,r]));for(const [key,edit]of Object.entries(edits)){const row=rows.get(key);if(row?.text===edit.text)delete edits[key];else if(!row||row.text!==edit.original)conflicts++;}
persist();render();status(conflicts?`${conflicts} 条草稿与原文件冲突。先导出草稿；保存不会覆盖冲突。`:`已读取 ${data.rows.length} 条文字。${pending().length?'已恢复 '+pending().length+' 条未保存草稿。':'可直接点击文字修改。'}`,!!conflicts);}
function filtered(){const term=$('search').value.trim().toLowerCase();return data.rows.filter(r=>{const mark=marks[r.key]||{};return (!$('chapter').value||r.chapter===$('chapter').value)&&(!$('person').value||r.speaker===$('person').value)&&($('scope').value==='all'||({chat:['消息','玩家选项'],memo:['备忘录'],social:['朋友圈'],scene:['现场台词']})[$('scope').value]?.includes(r.kind))&&(!term||[r.text,value(r),r.id,r.chat,r.context].join(' ').toLowerCase().includes(term))&&(!$('state').value||({flag:mark.flag,reviewed:mark.reviewed,unread:!mark.reviewed,changed:!!edits[r.key]})[$('state').value]);});}
function render(){if(!data)return;const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/40));page=Math.min(page,pages-1);$('count').textContent=`${rows.length} 条符合筛选`;$('page').textContent=`${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=page===pages-1;const list=$('list');list.replaceChildren();if(!rows.length)list.append(el('div','empty','没有符合条件的台词。可以换个筛选条件。'));
for(const row of rows.slice(page*40,page*40+40)){const card=el('article'),mark=marks[row.key]||{};card.classList.toggle('dirty',!!edits[row.key]);card.classList.toggle('flag',!!mark.flag);const meta=el('div','meta');meta.append(el('strong','',data.names[row.speaker]||row.speaker),el('span','',`${row.chapter==='other'?'其他互动':'第'+Number(row.chapter)+'章'} · ${row.chat} · ${row.kind}`));card.append(meta);if(row.context)card.append(el('div','branch',row.context));if(row.media)card.append(el('p','hint','此消息另有媒体，审阅页仅编辑文字，媒体引用保持不变。'));
const input=el('textarea');input.value=value(row);input.setAttribute('aria-label',(data.names[row.speaker]||row.speaker)+' · '+row.id);const old=el('div','old');old.hidden=!edits[row.key];old.textContent='原文：'+row.text;input.oninput=()=>{saveArmed=false;if(input.value===row.text)delete edits[row.key];else edits[row.key]={original:row.text,text:input.value};old.hidden=!edits[row.key];card.classList.toggle('dirty',!!edits[row.key]);persist();updateSave();};card.append(input,old);
const tools=el('div','tools');for(const [key,label]of [['reviewed','已审阅'],['flag','待润色']]){const wrap=el('label'),check=el('input');check.type='checkbox';check.checked=!!mark[key];check.onchange=()=>{marks[row.key]={...marks[row.key],[key]:check.checked};card.classList.toggle('flag',!!marks[row.key].flag);persist();};wrap.append(check,document.createTextNode(' '+label));tools.append(wrap);}
const reset=el('button','','还原此条');reset.onclick=()=>{delete edits[row.key];persist();render();};tools.append(reset);card.append(tools);
if($('context').checked&&['消息','玩家选项'].includes(row.kind)){const box=el('details','context');box.open=true;box.append(el('summary','','相邻上下文（含其他可能分支，仅供对照）'));const siblings=data.rows.filter(r=>r.chatId===row.chatId&&r.chapter===row.chapter&&r.kind!=='备忘录'),index=siblings.findIndex(r=>r.key===row.key);siblings.slice(Math.max(0,index-2),index+3).forEach(r=>{const b=el('div','bubble'+(r.speaker==='owner'?' me':''));b.append(el('small','',(r.key===row.key?'当前 · ':'')+(data.names[r.speaker]||r.speaker)+' · '+r.kind),document.createTextNode(value(r)));box.append(b);});card.append(box);}
card.append(el('div','source',row.file+' · '+row.id));list.append(card);}updateSave();}
for(const id of ['chapter','person','scope','state','context'])$(id).onchange=()=>{page=0;render();};$('search').oninput=()=>{page=0;render();};$('prev').onclick=()=>{page--;render();window.scrollTo(0,0);};$('next').onclick=()=>{page++;render();window.scrollTo(0,0);};
$('reload').onclick=()=>{if(confirm('重新读取会保留草稿并检查冲突。继续吗？'))load().catch(e=>status(e.message,true));};
$('save').onclick=async()=>{if(busy)return;const changes=pending().map(([key,v])=>({key,...v}));if(!saveArmed){saveArmed=true;status(`即将将 ${changes.length} 条文字写回源文件，并备份原文件。请再点一次“确认保存”；不会自动发布。`);updateSave();return;}saveArmed=false;busy=true;document.querySelectorAll("main,aside,.actions").forEach(n=>n.inert=true);updateSave();try{const result=await api('/save',{changes,versions:data.versions});edits={};persist();await load();status(`已保存 ${result.count} 条。备份：${result.backup}\n下一步：重新构建本地游戏并试玩，确认后再发布。`);}catch(e){status(e.message,true);}finally{busy=false;document.querySelectorAll("main,aside,.actions").forEach(n=>n.inert=false);updateSave();}};
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({format:'shoukun-dialogue-review-v1',edits,marks},null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download='台词审阅草稿-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('import').onclick=()=>$('draftFile').click();$('draftFile').onchange=async e=>{try{const draft=JSON.parse(await e.target.files[0].text());if(draft.format!=='shoukun-dialogue-review-v1'||!draft.edits||!draft.marks)throw Error('不是有效的审阅草稿');const keys=new Set(data.rows.map(r=>r.key));for(const [k,v]of Object.entries(draft.edits))if(!keys.has(k)||typeof v.text!=='string'||typeof v.original!=='string')throw Error('草稿含有无法匹配的台词');if(!confirm('导入后将合并草稿；同一条台词以导入稿为准。继续吗？'))return;edits={...edits,...draft.edits};marks={...marks,...draft.marks};persist();render();status('草稿已导入，尚未写入剧情文件。');}catch(error){status(error.message,true);}e.target.value='';};
window.addEventListener('beforeunload',e=>{if(pending().length){e.preventDefault();e.returnValue='';}});load().catch(e=>status('读取失败：'+e.message,true));
</script></html>
